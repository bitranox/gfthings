[project]
name = "gfthings"
version = "0.8.0"
description = "Paul's Gridfinity Things"
authors = [
    { name = "Paul Bone", email = "paul@bone.id.au" },
]
license = "CC-BY-NC-SA-4.0"
readme = "README.md"
requires-python = ">=3.10,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "build123d>=0.10.0",
]

[tool.uv.sources]
build123d = [
    { git = "https://github.com/gumyr/build123d.git", branch = "dev", marker = "python_version >= '3.14'" },
]

[project.urls]
Homepage = "https://github.com/PaulBone/gfthings"

[project.scripts]
gfpin = "gfthings.gfpin:main"
gfbin = "gfthings.gfbin:main"
gfbase = "gfthings.gfbase:main"
gfedge = "gfthings.gfedge:main"

[dependency-groups]
test = [
    "pytest>=8.3.5,<9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gfthings"]

[tool.hatch.build.targets.sdist]
include = [
    "gfthings",
    "tests",
    "README.md",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
